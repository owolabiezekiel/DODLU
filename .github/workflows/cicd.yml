name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Project
        run: mvn clean install
      - name: Login to docker hub
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
      - name: Build docker image
        run: docker build -t owolabiezekiel/dodlu-core-service .
      - name: Publish image to docker hub
        run: docker push owolabiezekiel/dodlu-core-service:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Print out directory
        run: ls
      - name: Pull image from docker hub
        run: sudo docker pull owolabiezekiel/dodlu-core-service:latest
      - name: Delete existing container
        run: sudo docker rm -f dodlu-core-service-container
      - name: Docker run container
        run: sudo docker run -d -p 9001:9001 --name dodlu-core-service-container owolabiezekiel/dodlu-core-service