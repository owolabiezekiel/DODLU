server:
  port: ${SERVER_PORT:9001}

spring:
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: 03f9dfcb82e813
    password: 6fdf17306be0d5
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd'T'HH:mm:ss
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      connection-test-query: SELECT 1
    url: jdbc:postgresql://${RDS_HOSTNAME:localhost}:${RDS_PORT:5432}/${RDS_DB_NAME:dodlu_db}
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:root}
    host: ${RDS_HOSTNAME:localhost}
    port: ${RDS_PORT:5432}
    db-name: ${RDS_DB_NAME:dodlu_db}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  liquibase:
    enabled: true
    change-log: ${LIQUIBASE_PATH:changelog/changeLog-master.xml}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}


management:
  auditevents:
    enabled: true
  endpoint:
    logfile:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
max:
  text:
    message:
      buffer:
        size: 8192
  binary:
    message:
      buffer:
        size: 8192
allowed:
  origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:*}
  headers: ${ALLOWED_HEADERS:*}
exposed:
  headers: ${EXPOSED_HEADERS:Access-Control-Allow-Origin,Access-Control-Allow-Credentials}
springdoc:
  api-docs:
    enabled: true
  packagesToScan: com.dodlu
logging:
  level:
    root: INFO
    com:
      dodlu: INFO
  file:
    name: dodlu-backend-service.log
  logback:
    rollingpolicy:
      max-file-size: 60MB
resource:
  id: dodlu-backend-service

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY:secret_key}
    region:
      static: ${AWS_REGION:us-east-2}
    bucket-name: ${S3_BUCKET_NAME:gameporte-test}

email:
  templates:
    new-account-email-template: ${NEW_ACCOUNT_EMAIL_TEMPLATE:d-98aa1a25725a4b0980c11df10c325d4b}
  provider:
    name: ${EMAIL_PROVIDER:send-grid}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:some-api-key}
      base-url: ${SENDGRID_BASE_URL:some-base-url}
    mailtrap:
      host: ${MAILTRAP_HOST:smtp.mailtrap.io}
      port: ${MAILTRAP_PORT:2525}
      username: ${MAILTRAP_USERNAME:03f9dfcb82e813}
      password: ${MAILTRAP_PASSWORD:6fdf17306be0d5}
      template-path: ${MAILTRAP_TEMPLATE_PATH:classpath:/templates}
      ssl: no
      tls: yes

dodlu:
  secrets:
    jwt-secret: ${JWT_SECRET:somesecret}
    jwt-expiration: ${JWT_EXPIRATION:86400000}