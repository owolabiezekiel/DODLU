server:
  port: ${SERVER_PORT:9001}

spring:
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: 03f9dfcb82e813
    password: 6fdf17306be0d5
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd'T'HH:mm:ss
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      connection-test-query: SELECT 1
      auto-commit: ${AUTO_COMMIT:false}
    url: jdbc:postgresql://${RDS_HOSTNAME:localhost}:${RDS_PORT:5432}/${RDS_DB_NAME:dodlu_db}
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:root}

  jpa:
    open-in-view: ${OPEN_IN_VIEW:false}
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: ${LIQUIBASE_PATH:changelog/changeLog-master.xml}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}


management:
  endpoints:
    web:
      exposure:
        include: "*"

  prometheus:
    metrics:
      export:
        step: 5s
        enabled: true

  metrics:
    enable:
      all: true
    distribution:
      percentiles-histogram:
        all: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

  auditevents:
    enabled: true

  endpoint:
    prometheus:
      enabled: true
    logfile:
      enabled: true
    health:
      show-details: always

max:
  text:
    message:
      buffer:
        size: 8192
  binary:
    message:
      buffer:
        size: 8192
allowed:
  origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:*}
  headers: ${ALLOWED_HEADERS:*}
exposed:
  headers: ${EXPOSED_HEADERS:Access-Control-Allow-Origin,Access-Control-Allow-Credentials}
springdoc:
  api-docs:
    enabled: true
  packagesToScan: com.dodlu
logging:
  level:
    org.springframework.boot.actuate: DEBUG
    io.micrometer: DEBUG
    root: INFO
    com:
      dodlu: INFO
  file:
    name: dodlu-backend-service.log
  logback:
    rollingpolicy:
      max-file-size: 60MB
resource:
  id: dodlu-backend-service

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY:secret_key}
    region:
      static: ${AWS_REGION:us-east-2}
    bucket-name: ${S3_BUCKET_NAME:gameporte-test}

email:
  provider:
    mailtrap:
      host: ${MAILTRAP_HOST:smtp.mailtrap.io}
      port: ${MAILTRAP_PORT:2525}
      username: ${MAILTRAP_USERNAME:03f9dfcb82e813}
      password: ${MAILTRAP_PASSWORD:6fdf17306be0d5}
      template-path: ${MAILTRAP_TEMPLATE_PATH:classpath:/templates}
      ssl: no
      tls: yes

